# /!\ This launcher configuration works from inside TMUX (different from the other .conf file)

# tab 1 — shell libre à la racine
tmux new -d -s tamb -n 'Tambouille' -c ~/dev/tambouille/
tmux send -t tamb 'gls' Enter

# tab 2 — API backend .NET
tmux neww -t tamb -n 'API' -c ~/dev/tambouille/backend
tmux send -t tamb:'API' 'dotnet run' Enter

# tab 3 — UI frontend Vite
tmux neww -t tamb -n 'UI' -c ~/dev/tambouille/frontend
tmux send -t tamb:'UI' 'npm run dev' Enter

# tab 4 — lazygit
tmux neww -t tamb -n 'Git' -c ~/dev/tambouille
tmux send -t tamb:'Git' 'lazygit' Enter

# tab 5 — claude
tmux neww -t tamb -n 'Claude' -c ~/dev/tambouille
tmux send -t tamb:'Claude' 'claude' Enter

tmux set-window-option -g window-status-current-format " #W "
tmux set-window-option -g window-status-format " #W#(printf '%%s\n' '#F' | sed 's/-//') "

# Focus le shell libre
tmux select-window -t tamb:'Tambouille'
tmux switch-client -t tamb
