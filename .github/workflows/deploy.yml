name: Build, Publish Images to DockerHub & Deploy
on: [workflow_dispatch, push]

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'backend/**'
            ui:
              - 'frontend/**'

  build_api:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/login-action@v3
        with:
          username: blueint32
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: blueint32/tambouille-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build_ui:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/login-action@v3
        with:
          username: blueint32
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: blueint32/tambouille-ui:latest
          build-args: VITE_API_URL=https://tambouille-api.persistor.ovh
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build_api, build_ui]
    if: always() && !failure() && !cancelled()
    env:
      PORTAINER_HOST: 'portainer.persistor.ovh'
      PORTAINER_ENDPOINT_ID: 3
      PORTAINER_STACK_ID: 20
    steps:
      - name: Deploy to Portainer
        shell: bash
        run: |
          curl \
            --url 'https://${{ env.PORTAINER_HOST }}/api/stacks/${{ env.PORTAINER_STACK_ID }}?endpointId=${{ env.PORTAINER_ENDPOINT_ID }}' \
            --request PUT \
            --header "x-api-key: ${{ secrets.PORTAINER_API_KEY }}" \
            --header 'Content-Type: application/json' \
            --data "{
              \"env\": [],
              \"prune\": true,
              \"pullImage\": true,
              \"stackFileContent\": \"services:\n  tambouille-api:\n    image: blueint32/tambouille-api:latest\n    restart: unless-stopped\n    volumes:\n      - /home/ubuntu/tambouille/data:/data\n    environment:\n      - Auth__Password=${{ secrets.TAMBOUILLE_AUTH_PASSWORD }}\n      - Auth__JwtSecret=${{ secrets.TAMBOUILLE_JWT_SECRET }}\n      - ConnectionStrings__Default=Data Source=/data/tambouille.db\n    ports:\n      - 8888:8888\n    networks:\n      - proxy-network\n  tambouille-ui:\n    image: blueint32/tambouille-ui:latest\n    restart: unless-stopped\n    ports:\n      - 3333:80\n    networks:\n      - proxy-network\nnetworks:\n  proxy-network:\n    external: true\n\"
            }"
